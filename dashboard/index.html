<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tiger Dash — hourly sensor rollups</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        color: #0f172a;
        background: #f8fafc;
      }
      main {
        max-width: 960px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      h1 {
        font-size: 1.5rem;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
        box-shadow: 0 1px 3px rgb(0 0 0 / 0.08);
      }
      th,
      td {
        padding: 0.5rem 0.75rem;
        text-align: left;
        border-bottom: 1px solid #e2e8f0;
      }
      th {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #64748b;
      }
      .meta {
        color: #64748b;
        font-size: 0.9rem;
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hourly rollups (continuous aggregate)</h1>
      <p class="meta">
        Data from <code>ghw_sensor_hourly</code> on Tiger Cloud — pre-aggregated
        with TimescaleDB continuous aggregates for fast dashboard queries.
      </p>
      <table>
        <thead>
          <tr>
            <th>Bucket (UTC)</th>
            <th>Sensor</th>
            <th>Metric</th>
            <th>Samples</th>
            <th>Avg</th>
            <th>Min</th>
            <th>Max</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </main>
    <script>
      fetch("/api/metrics?hours=48")
        .then((r) => r.json())
        .then((rows) => {
          const tbody = document.getElementById("rows");
          if (!rows.length) {
            tbody.innerHTML =
              "<tr><td colspan='7'>No rows yet — run setup_continuous_aggregate.sql and refresh.</td></tr>";
            return;
          }
          tbody.innerHTML = rows
            .map(
              (r) => `<tr>
              <td>${r.bucket}</td>
              <td>${r.sensor_id}</td>
              <td>${r.metric}</td>
              <td>${r.sample_count}</td>
              <td>${r.avg_value?.toFixed(2) ?? "—"}</td>
              <td>${r.min_value?.toFixed(2) ?? "—"}</td>
              <td>${r.max_value?.toFixed(2) ?? "—"}</td>
            </tr>`
            )
            .join("");
        })
        .catch((e) => {
          document.getElementById("rows").innerHTML =
            `<tr><td colspan='7'>${e.message}</td></tr>`;
        });
    </script>
  </body>
</html>
